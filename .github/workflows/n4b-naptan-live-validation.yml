name: N4B NaPTAN Live Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  N4B_BASELINE_SHA: 8627dbfd586df9069b2f73b0cc2d6543645fa950
  N4B_MIGRATION: supabase/migrations/20260822170000_naptan_transport_source_graph.sql
  N4B_MIGRATION_SHA256: 087A389B8CEAC021B12708BC55C39022CB38D5459510EFFB6CF057CEF232C44E
  SUPABASE_CLI_VERSION: 2.75.0
  N4B_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  live-validation:
    name: Disposable Supabase/PostGIS validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the requested branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository and sealed input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          migration_sha="$(sha256sum "$N4B_MIGRATION" | awk '{print toupper($1)}')"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "ref=${GITHUB_REF}"
            echo "tested_sha=${local_sha}"
            echo "remote_branch_sha=${remote_sha}"
            echo "required_baseline_sha=${N4B_BASELINE_SHA}"
            echo "migration=${N4B_MIGRATION}"
            echo "migration_sha256=${migration_sha}"
            echo "production_mutations=0"
          } | tee evidence/run-metadata.txt
          test "$GITHUB_REF_NAME" = "codex/toilet-map-apply-1a-production-deploy"
          test "$remote_sha" = "$local_sha"
          test "$migration_sha" = "$N4B_MIGRATION_SHA256"
          git cat-file -e "${N4B_BASELINE_SHA}:${N4B_MIGRATION}"
          baseline_sha="$(git show "${N4B_BASELINE_SHA}:${N4B_MIGRATION}" | sha256sum | awk '{print toupper($1)}')"
          test "$baseline_sha" = "$N4B_MIGRATION_SHA256"
          echo "baseline_migration_sha256=$baseline_sha" | tee -a evidence/run-metadata.txt

      - name: Verify committed Apply 1A evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee evidence/apply-1a-evidence-inputs.txt
          import json
          from pathlib import Path
          from tools.enrichment.apply_engine_1a import (
              EXPECTED_APPROVED_MANIFEST_SHA256,
              EXPECTED_APPROVED_PLAN_SHA256,
              EXPECTED_SOURCE_CHECKSUM,
              validate_manifest_identity,
              validate_plan,
              sha256_bytes,
          )

          root = Path.cwd()
          plan_path = root / 'docs/data/TOILET_MAP_PROPOSED_APPLY_PLAN_2026-08.json'
          manifest_path = root / 'docs/data/TOILET_MAP_APPLY_1A_MANIFEST.json'
          plan_bytes = plan_path.read_bytes()
          # The approved Apply 1A plan hash was recorded from the Windows
          # working-tree artifact. GitHub checkout normalizes the tracked blob
          # to LF, so reproduce the recorded byte representation in memory;
          # never rewrite the committed evidence file.
          normalized_plan_bytes = plan_bytes.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          plan = json.loads(normalized_plan_bytes.decode('utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw_checkout_sha = sha256_bytes(plan_bytes)
          plan_sha = sha256_bytes(normalized_plan_bytes)
          validate_plan(plan, plan_sha)
          validate_manifest_identity(manifest, plan_sha, EXPECTED_SOURCE_CHECKSUM)
          assert manifest['manifest_sha256'] == EXPECTED_APPROVED_MANIFEST_SHA256
          print(f'raw_checkout_plan_sha256={raw_checkout_sha}')
          print(f'approved_plan_sha256={plan_sha}')
          print(f'approved_manifest_sha256={manifest["manifest_sha256"]}')
          print(f'approved_source_sha256={EXPECTED_SOURCE_CHECKSUM}')
          print(f'approved_operation_count={len(manifest["operations"])}')
          print('committed_apply_1a_evidence=PASS')
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Record hosted runtime versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version)"
            echo "python=$(python --version 2>&1)"
            echo "supabase=$(supabase --version | head -n 1)"
            echo "psql=$(psql --version)"
          } | tee evidence/runtime-versions.txt

      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci

      - name: Initialize disposable Supabase project configuration
        shell: bash
        run: supabase init --force --yes

      - name: Start disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          pending_dir='supabase/migrations.n4b-pending'
          pending_seed='supabase/seed.n4b-pending.sql'
          test ! -e "$pending_dir"
          test ! -e "$pending_seed"
          mv supabase/migrations "$pending_dir"
          mkdir supabase/migrations
          mv supabase/seed.sql "$pending_seed"
          : > supabase/seed.sql
          restore_migrations() {
            rm -rf supabase/migrations
            mv "$pending_dir" supabase/migrations
            rm -f supabase/seed.sql
            mv "$pending_seed" supabase/seed.sql
          }
          trap restore_migrations EXIT
          supabase start --yes
          restore_migrations
          trap - EXIT

      - name: Verify PostgreSQL runtime and PostGIS availability
        shell: bash
        run: |
          set -euo pipefail
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -Atc "select version();" | tee evidence/postgresql-version.txt
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -Atc "select name || '=' || coalesce(default_version, '') from pg_available_extensions where name = 'postgis';" | tee evidence/postgis-availability.txt
          test -s evidence/postgis-availability.txt

      - name: Bootstrap disposable migration executor role
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          admin_password="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$db_container" | sed -n 's/^POSTGRES_PASSWORD=//p')"
          test -n "$admin_password"
          docker exec -e "PGPASSWORD=${admin_password}" "$db_container" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "grant supabase_admin to postgres;" 2>&1 | tee evidence/disposable-role-bootstrap.txt
          echo 'disposable_role_bootstrap=GRANT supabase_admin TO postgres' | tee -a evidence/run-metadata.txt

      - name: Apply canonical migrations through the historical Apply 1A seal boundary
        shell: bash
        run: |
          set -euo pipefail
          seal_migration='supabase/migrations/20260812190246_seal_apply_1a_execution_path.sql'
          hold_dir="$RUNNER_TEMP/n4b-migrations-after-apply-1a-seal"
          mkdir -p "$hold_dir"
          found_seal=0
          while IFS= read -r filename; do
            if [[ "$filename" == "20260812190246_seal_apply_1a_execution_path.sql" ]]; then
              found_seal=1
            fi
            if [[ "$found_seal" == 1 ]]; then
              mv "supabase/migrations/$filename" "$hold_dir/$filename"
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "$found_seal" = 1
          echo 'pre_seal_last_migration=20260812124351_apply_1a_facilities_update_rls.sql' | tee evidence/migration-boundary.txt
          echo 'resume_first_migration=20260812190246_seal_apply_1a_execution_path.sql' | tee -a evidence/migration-boundary.txt
          supabase migration up --local --yes 2>&1 | tee evidence/migration-chain-pre-seal.txt
          test ! -e "$seal_migration"
          mv "$hold_dir"/*.sql supabase/migrations/
          test -e "$seal_migration"

      - name: Reconstruct the committed historical Apply 1A prerequisite in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -f tools/enrichment/n4b_historical_apply_1a_bootstrap.sql 2>&1 | tee evidence/historical-apply-1a-bootstrap.txt
          grep -q 'N4B_HISTORICAL_APPLY_1A_BOOTSTRAP_PASSED' evidence/historical-apply-1a-bootstrap.txt

      - name: Resume canonical migration chain from the historical seal through N4A
        shell: bash
        run: |
          set -euo pipefail
          supabase migration up --local --yes 2>&1 | tee evidence/migration-chain-post-bootstrap.txt
          grep -q '20260812190246_seal_apply_1a_execution_path.sql' evidence/migration-chain-post-bootstrap.txt
          grep -q "$N4B_MIGRATION" evidence/migration-chain-post-bootstrap.txt
          echo 'historical_seal_execution=PASS' | tee evidence/historical-seal-execution.txt
          echo 'n4a_migration_execution=PASS' | tee -a evidence/historical-seal-execution.txt

      - name: Verify PostGIS active after migration chain
        shell: bash
        run: |
          set -euo pipefail
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -Atc "select version(); select postgis_full_version(); select extname || '=' || extversion from pg_extension where extname = 'postgis';" | tee evidence/postgis-version.txt
          test -s evidence/postgis-version.txt

      - name: Re-verify the sealed migration after bootstrap
        shell: bash
        run: |
          set -euo pipefail
          migration_sha="$(sha256sum "$N4B_MIGRATION" | awk '{print toupper($1)}')"
          echo "$migration_sha" | tee evidence/migration-sha256-after-bootstrap.txt
          test "$migration_sha" = "$N4B_MIGRATION_SHA256"

      - name: Run N4A deterministic Python validation
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m unittest tools.source_expansion.test_naptan_n4a -v 2>&1 | tee evidence/n4a-python-tests.txt
          python -m py_compile tools/source_expansion/naptan_n4a.py tools/source_expansion/test_naptan_n4a.py
          echo "python_compilation=PASS" | tee evidence/python-compilation.txt

      - name: Run TypeScript validation
        shell: bash
        run: npm run typecheck 2>&1 | tee evidence/typescript-typecheck.txt

      - name: Run JavaScript/TypeScript test harness
        shell: bash
        run: npm test 2>&1 | tee evidence/javascript-tests.txt

      - name: Run repository lint validation
        shell: bash
        run: npm run lint 2>&1 | tee evidence/lint.txt

      - name: Run live PostgreSQL/PostGIS N4B assertions
        shell: bash
        run: |
          set -euo pipefail
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -f tools/source_expansion/naptan_n4b_live_validation.sql 2>&1 | tee evidence/live-sql-assertions.txt

      - name: Run actual role access checks
        shell: bash
        run: |
          set -euo pipefail
          check_denied() {
            local role="$1"
            local output="evidence/role-${role}.txt"
            if psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -c "set role ${role}; select count(*) from public.transport_source_snapshots;" >"$output" 2>&1; then
              echo "${role}=UNEXPECTED_ACCESS" | tee -a evidence/role-access-summary.txt
              return 1
            fi
            grep -Eqi 'permission denied|must be owner|not have permission' "$output"
            echo "${role}=DENIED" | tee -a evidence/role-access-summary.txt
          }
          : > evidence/role-access-summary.txt
          check_denied anon
          check_denied authenticated
          psql -X "$N4B_DB_URL" -v ON_ERROR_STOP=1 -c "set role service_role; select count(*) from public.transport_source_snapshots; begin; insert into public.transport_source_snapshots (source_namespace, product_name, source_snapshot_key, source_url, source_checksum_sha256, source_byte_size, retrieved_at, licence, attribution, parser_version) values ('n4b', 'service-role-fixture', 'n4b:sha256:$(printf 'c%.0s' {1..64})', 'https://example.invalid/n4b-service-role', '$(printf 'c%.0s' {1..64})', 0, now(), 'test', 'test', 'n4b-ci'); rollback;" > evidence/role-service_role.txt 2>&1
          echo "service_role=READ_AND_ROLLBACK_WRITE" | tee -a evidence/role-access-summary.txt

      - name: Confirm production safety invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'bgwxrxkmyaihplaloely|supabase link|supabase db push|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL' .github/workflows tools/source_expansion/naptan_n4b_live_validation.sql; then
            echo 'production reference or credential pattern found in N4B validation scope' >&2
            exit 1
          fi
          echo 'TOTAL PRODUCTION MUTATIONS: 0' | tee evidence/production-safety.txt

      - name: Upload N4B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4b-live-validation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup --yes
          else
            echo 'supabase_cli_not_started; no disposable stack cleanup required'
          fi
